name: Issue — Welcome & Label

on:
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Apply user-replied label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['user-replied']
            });

      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const repoName = context.repo.repo;

            const body = [
              `Hey @${author}, the accountant is on it. 📊`,
              ``,
              `Thanks for filing this report — @TheCodingDad-TisonK has been notified and will review your case as soon as possible.`,
              ``,
              `**Before the books are opened, please confirm:**`,
              ``,
              `- [ ] You are running the latest version of Income Mod (visible in the mod manager)`,
              `- [ ] Your issue includes the relevant \`[IncomeMod]\` lines from \`log.txt\``,
              `  - Log location: \`Documents/My Games/FarmingSimulator2025/log.txt\``,
              `  - Search for \`[IncomeMod]\` and paste the relevant section here`,
              `- [ ] If this involves a specific income category (crops, animals, contracts, etc.) — mention which one and what amounts are expected vs. shown`,
              `- [ ] You have searched [existing issues](https://github.com/${context.repo.owner}/${repoName}/issues) for a similar report`,
              ``,
              `> **Note:** Issues without a log snippet are difficult to investigate and may be closed. Income discrepancies often require log data to trace.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
